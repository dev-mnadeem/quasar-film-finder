server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed build assets and generated posters never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /posters/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # History-mode router: every unknown path is the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
